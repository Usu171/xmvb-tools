[build-system]
requires = ["uv_build>=0.9.0"]
build-backend = "uv_build"

[project]
name = "xmvb-tools"
version = "0.2.0"
description = "Tools for XMVB orbital and Molden file conversion."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Usu171" }]
dependencies = ["numpy"]

[project.scripts]
vb2molden = "xmvb_tools.vb2molden:cli"
molden2gus = "xmvb_tools.molden2gus:cli"
gus2molden = "xmvb_tools.gus2molden:cli"
sortw = "xmvb_tools.sortw:cli"
no2molden = "xmvb_tools.no2molden:cli"


[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
lint = ["ruff"]


[tool.uv.build-backend]
module-name = "xmvb_tools"


[tool.ruff]
line-length = 100
[tool.ruff.format]
quote-style = "single"
